name: Release macOS Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify TypeScript & Web Console Build
        run: |
          npm install
          npm run lint
          npm run build

      - name: Compile Native macOS Apple Silicon Binaries
        run: |
          mkdir -p release-staging/LumaBridge-${{ steps.version.outputs.tag }}-macos-arm64/macos
          swiftc -O \
            -framework Cocoa \
            -framework IOKit \
            -framework CoreGraphics \
            macos/LumaBridgeDaemon.swift \
            -o release-staging/LumaBridge-${{ steps.version.outputs.tag }}-macos-arm64/macos/lumabridged

          swiftc -O \
            -framework IOKit \
            -framework CoreGraphics \
            macos/lumabridge-ctl.swift \
            -o release-staging/LumaBridge-${{ steps.version.outputs.tag }}-macos-arm64/macos/lumabridge-ctl

          cp install-lumabridge.sh release-staging/LumaBridge-${{ steps.version.outputs.tag }}-macos-arm64/
          cp README.md CHANGELOG.md release-staging/LumaBridge-${{ steps.version.outputs.tag }}-macos-arm64/
          cp macos/LumaBridgeDaemon.swift macos/lumabridge-ctl.swift macos/com.lumabridge.daemon.plist macos/config.default.json \
            release-staging/LumaBridge-${{ steps.version.outputs.tag }}-macos-arm64/macos/
          chmod +x release-staging/LumaBridge-${{ steps.version.outputs.tag }}-macos-arm64/install-lumabridge.sh

      - name: Package Tarball & Checksums
        run: |
          cd release-staging
          tar -czf "../LumaBridge-${{ steps.version.outputs.tag }}-macos-arm64.tar.gz" "LumaBridge-${{ steps.version.outputs.tag }}-macos-arm64"
          cd ..
          shasum -a 256 "LumaBridge-${{ steps.version.outputs.tag }}-macos-arm64.tar.gz" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LumaBridge ${{ steps.version.outputs.tag }}
          body_path: CHANGELOG.md
          files: |
            LumaBridge-${{ steps.version.outputs.tag }}-macos-arm64.tar.gz
            SHA256SUMS.txt
